- name: update hetzner server
  hosts: hetzner
  remote_user: root

  tasks:
  - name: update apt cache
    ansible.builtin.apt:
      update_cache: yes
  - name: upgrade packages
    ansible.builtin.apt:
      upgrade: dist


- name: configure hetzner server
  hosts: hetzner
  remote_user: root

  tasks:
  - name: install curl
    ansible.builtin.apt:
      name: curl
      state: present
  - name: install tailscale
    ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
    args:
      creates: /usr/bin/tailscale
    when: install_tailscale
  - name: get hetzner tailscale ipv4
    ansible.builtin.shell: tailscale ip -4
    register: tailscale_ipv4
    when: install_tailscale
  - name: create k3s config directory
    ansible.builtin.file:
      path: /etc/rancher/k3s
      state: directory
  - name: create k3s config with tailscale ip
    ansible.builtin.copy:
      content: |
        tls-san:
          - {{ tailscale_ipv4.stdout }}
        flannel-backend: none
        disable-network-policy: true
      dest: /etc/rancher/k3s/config.yaml
    when: install_tailscale
  - name: create k3s config with static ip
    ansible.builtin.copy:
      content: |
        tls-san:
          - {{ k3s_tls_san }}
        flannel-backend: none
        disable-network-policy: true
      dest: /etc/rancher/k3s/config.yaml
    when: not install_tailscale and k3s_tls_san is defined
  - name: install k3s
    ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
    args:
      creates: /usr/local/bin/k3s
  - name: install cilium cli
    ansible.builtin.shell: >
      CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt) &&
      curl -L --fail --remote-name-all
      https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-amd64.tar.gz &&
      tar xzvfC cilium-linux-amd64.tar.gz /usr/local/bin &&
      rm cilium-linux-amd64.tar.gz
    args:
      creates: /usr/local/bin/cilium
  - name: install cilium on cluster
    ansible.builtin.shell: /usr/local/bin/cilium install --set kubeProxyReplacement=true
    environment:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  - name: wait for cilium to be ready
    ansible.builtin.shell: /usr/local/bin/cilium status --wait
    environment:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: install and apply argocd manifest
  hosts: hetzner
  remote_user: root

  tasks:
  - name: create argocd namespace
    ansible.builtin.shell: /usr/local/bin/kubectl create namespace argocd --dry-run=client -o yaml | /usr/local/bin/kubectl apply -f -
  - name: apply argocd manifest
    ansible.builtin.shell: /usr/local/bin/kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.3.6/manifests/install.yaml
  - name: wait for argocd server to be ready
    ansible.builtin.shell: /usr/local/bin/kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=120s

- name: bootstrap argocd with repo secret and root app
  hosts: hetzner
  remote_user: root

  tasks:
  - name: copy argocd deploy key to server
    ansible.builtin.copy:
      src: "{{ argocd_deploy_key }}"
      dest: /tmp/argocd-homelab
      mode: "0600"
  - name: create homelab-repo secret
    ansible.builtin.shell: >
      /usr/local/bin/kubectl create secret generic homelab-repo
      --from-literal=type=git
      --from-literal=url=git@github.com:nopsqi/homelab.git
      --from-file=sshPrivateKey=/tmp/argocd-homelab
      -n argocd
      --dry-run=client -o yaml |
      /usr/local/bin/kubectl apply -f -
  - name: label homelab-repo secret for argocd
    ansible.builtin.shell: /usr/local/bin/kubectl label secret homelab-repo argocd.argoproj.io/secret-type=repository -n argocd --overwrite
  - name: remove deploy key from server
    ansible.builtin.file:
      path: /tmp/argocd-homelab
      state: absent
  - name: copy root app manifest to server
    ansible.builtin.copy:
      src: "{{ playbook_dir }}/../argocd/{{ environment_name }}/root.yaml"
      dest: /tmp/root.yaml
  - name: apply root app
    ansible.builtin.shell: /usr/local/bin/kubectl apply -f /tmp/root.yaml
  - name: remove root app manifest from server
    ansible.builtin.file:
      path: /tmp/root.yaml
      state: absent
  - name: wait for sealed-secrets namespace
    ansible.builtin.shell: /usr/local/bin/kubectl get namespace sealed-secrets
    register: ns_check
    until: ns_check.rc == 0
    retries: 30
    delay: 10
  - name: copy sealed secrets key backup to server
    ansible.builtin.copy:
      src: "{{ sealed_secrets_key_backup }}"
      dest: /tmp/sealed-secrets-key-backup.yaml
      mode: "0600"
  - name: restore sealed secrets controller key
    ansible.builtin.shell: /usr/local/bin/kubectl apply -f /tmp/sealed-secrets-key-backup.yaml
  - name: remove sealed secrets key backup from server
    ansible.builtin.file:
      path: /tmp/sealed-secrets-key-backup.yaml
      state: absent
  - name: restart sealed-secrets controller to pick up restored key
    ansible.builtin.shell: /usr/local/bin/kubectl rollout restart deployment/sealed-secrets -n sealed-secrets
