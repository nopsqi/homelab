- name: create argocd namespace
  ansible.builtin.shell: /usr/local/bin/kubectl create namespace argocd --dry-run=client -o yaml | /usr/local/bin/kubectl apply -f -

- name: build argocd chart dependencies (control machine)
  ansible.builtin.command: helm dependency build {{ playbook_dir }}/../helm/argocd
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false

# Rendered locally, applied server-side: no Helm release object on the cluster, so the
# argocd Application (argocd/<env>/argocd.yaml) later adopts these objects without conflict.
- name: render argocd chart (control machine)
  ansible.builtin.shell: >
    helm template argocd {{ playbook_dir }}/../helm/argocd --namespace argocd --include-crds
    -f {{ playbook_dir }}/../helm/argocd/values.yaml
    -f {{ playbook_dir }}/../helm/argocd/values.{{ environment_name }}.yaml
    > /tmp/argocd-rendered-{{ environment_name }}.yaml
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false

- name: detect pre-chart argocd install
  ansible.builtin.shell: >
    /usr/local/bin/kubectl -n argocd get deployment argocd-server
    -o jsonpath='{.metadata.labels.app\.kubernetes\.io/instance}' 2>/dev/null || echo absent
  register: argocd_instance_label
  changed_when: false

# Upstream manifests and the chart use different selector labels; selectors are immutable.
# Upstream also shipped per-component NetworkPolicies (the server one is allow-all), which
# would override the chart's tunnel-only rule. CRDs, Applications, ConfigMaps and Secrets stay.
- name: remove pre-chart argocd workloads and policies (one-time migration)
  ansible.builtin.shell: >
    /usr/local/bin/kubectl -n argocd delete deployment,statefulset,networkpolicy
    -l app.kubernetes.io/part-of=argocd --wait=true --timeout=120s
  when: argocd_instance_label.stdout == ""

- name: copy rendered argocd manifest to server
  ansible.builtin.copy:
    src: /tmp/argocd-rendered-{{ environment_name }}.yaml
    dest: /tmp/argocd-rendered.yaml
    mode: "0600"

- name: apply argocd
  ansible.builtin.shell: /usr/local/bin/kubectl apply -n argocd --server-side --force-conflicts -f /tmp/argocd-rendered.yaml

- name: remove rendered manifest from server
  ansible.builtin.file:
    path: /tmp/argocd-rendered.yaml
    state: absent

- name: wait for argocd server to be ready
  ansible.builtin.shell: /usr/local/bin/kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=180s

- name: copy argocd deploy key to server
  ansible.builtin.copy:
    src: "{{ argocd_deploy_key }}"
    dest: /tmp/argocd-homelab
    mode: "0600"

- name: create homelab-repo secret
  ansible.builtin.shell: >
    /usr/local/bin/kubectl create secret generic homelab-repo
    --from-literal=type=git
    --from-literal=url=git@github.com:nopsqi/homelab.git
    --from-file=sshPrivateKey=/tmp/argocd-homelab
    -n argocd
    --dry-run=client -o yaml |
    /usr/local/bin/kubectl apply -f -

- name: label homelab-repo secret for argocd
  ansible.builtin.shell: /usr/local/bin/kubectl label secret homelab-repo argocd.argoproj.io/secret-type=repository -n argocd --overwrite

- name: remove deploy key from server
  ansible.builtin.file:
    path: /tmp/argocd-homelab
    state: absent

- name: copy root app manifest to server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../argocd/{{ environment_name }}/root.yaml"
    dest: /tmp/root.yaml

- name: apply root app
  ansible.builtin.shell: /usr/local/bin/kubectl apply -f /tmp/root.yaml

- name: remove root app manifest from server
  ansible.builtin.file:
    path: /tmp/root.yaml
    state: absent

- name: wait for sealed-secrets namespace
  ansible.builtin.shell: /usr/local/bin/kubectl get namespace sealed-secrets
  register: ns_check
  until: ns_check.rc == 0
  retries: 30
  delay: 10

- name: copy sealed secrets key backup to server
  ansible.builtin.copy:
    src: "{{ sealed_secrets_key_backup }}"
    dest: /tmp/sealed-secrets-key-backup.yaml
    mode: "0600"

- name: restore sealed secrets controller key
  ansible.builtin.shell: >
    cat /tmp/sealed-secrets-key-backup.yaml |
    /usr/local/bin/kubectl replace --force -f -

- name: remove sealed secrets key backup from server
  ansible.builtin.file:
    path: /tmp/sealed-secrets-key-backup.yaml
    state: absent

- name: restart sealed-secrets controller to pick up restored key
  ansible.builtin.shell: /usr/local/bin/kubectl rollout restart deployment/sealed-secrets -n sealed-secrets
