- name: install calico operator
  ansible.builtin.shell: /usr/local/bin/kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.3/manifests/tigera-operator.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: install calico custom resource
  ansible.builtin.shell: |
    cat <<'EOF' | /usr/local/bin/kubectl apply -f -
    apiVersion: operator.tigera.io/v1
    kind: Installation
    metadata:
      name: default
    spec:
      calicoNetwork:
        ipPools:
        - name: default-ipv4-ippool
          blockSize: 26
          cidr: 10.42.0.0/16
          encapsulation: VXLANCrossSubnet
          natOutgoing: Enabled
          nodeSelector: all()
    ---
    apiVersion: operator.tigera.io/v1
    kind: APIServer
    metadata:
      name: default
    spec: {}
    EOF
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: wait for calico to be ready
  ansible.builtin.shell: /usr/local/bin/kubectl wait --for=condition=ready pod -l k8s-app=calico-node -n calico-system --timeout=120s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: calico_wait
  until: calico_wait.rc == 0
  retries: 10
  delay: 10

- name: wait for calico apiserver
  ansible.builtin.shell: /usr/local/bin/kubectl wait --for=condition=Available apiservice v3.projectcalico.org --timeout=120s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: calico_api_wait
  until: calico_api_wait.rc == 0
  retries: 10
  delay: 10

# The node's public IPs stay out of git (the repo is public). Workload policies
# block pod -> node traffic by label (role == 'node-public-ip') instead.
# Re-run after the server's IP changes.
- name: node public ip network set
  ansible.builtin.shell: |
    cat <<'EOF' | /usr/local/bin/kubectl apply -f -
    apiVersion: projectcalico.org/v3
    kind: GlobalNetworkSet
    metadata:
      name: node-public-ips
      labels:
        role: node-public-ip
    spec:
      nets:
        - {{ ansible_default_ipv4.address }}/32
    {% if ansible_default_ipv6.address is defined %}
        - {{ ansible_default_ipv6.address }}/128
    {% endif %}
    EOF
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
