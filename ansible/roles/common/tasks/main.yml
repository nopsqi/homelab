- name: update apt cache
  ansible.builtin.apt:
    update_cache: yes

- name: upgrade packages
  ansible.builtin.apt:
    upgrade: dist

- name: increase inotify limits for kubernetes
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    reload: true
  loop:
    - { name: fs.inotify.max_user_instances, value: "512" }
    - { name: fs.inotify.max_user_watches, value: "524288" }

- name: install curl
  ansible.builtin.apt:
    name: curl
    state: present

- name: create 2GB swap file
  ansible.builtin.command: fallocate -l 2G /swapfile
  args:
    creates: /swapfile

- name: set swap file permissions
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"

- name: format swap file
  ansible.builtin.command: mkswap /swapfile
  register: mkswap_result
  changed_when: mkswap_result.rc == 0
  failed_when: false

- name: enable swap file
  ansible.builtin.command: swapon /swapfile
  register: swapon_result
  changed_when: swapon_result.rc == 0
  failed_when: false

- name: add swap to fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    state: present

- name: set swappiness to 10
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_set: true
    reload: true

# kube-router (K3s built-in NetworkPolicy) filters bridged pod traffic through iptables.
# Without these, policies are accepted by the API and enforce nothing.
- name: load br_netfilter at boot
  ansible.builtin.copy:
    content: "br_netfilter\n"
    dest: /etc/modules-load.d/br_netfilter.conf

- name: load br_netfilter now
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: bridge netfilter sysctls
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_set: true
    reload: true
  loop:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables

- name: install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: nftables.d directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"

- name: node-ip guard ruleset
  ansible.builtin.template:
    src: homelab.nft.j2
    dest: /etc/nftables.d/homelab.nft
    mode: "0644"
  notify: reload homelab-nft

# Debian's nftables.service flushes the whole ruleset on start, which would wipe k3s rules;
# this unit loads only our table.
- name: node-ip guard unit
  ansible.builtin.copy:
    src: homelab-nft.service
    dest: /etc/systemd/system/homelab-nft.service
    mode: "0644"
  notify: reload homelab-nft

- name: enable node-ip guard
  ansible.builtin.systemd:
    name: homelab-nft
    enabled: true
    state: started
    daemon_reload: true
