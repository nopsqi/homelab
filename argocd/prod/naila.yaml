apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: naila
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nopsqi/homelab.git
    targetRevision: c626923  # pinned: last commit with helm/naila; detached and removed in the rename plan Task 7
    path: helm/naila
    helm:
      valueFiles:
        - values.yaml
        - values.prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: naila
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
