apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: naila
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nopsqi/homelab.git
    targetRevision: 2fbba81  # pinned: prod commit with helm/naila at the live tag; detached and removed in the rename plan Task 7
    path: helm/naila
    helm:
      valueFiles:
        - values.yaml
        - values.prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: naila
  # Detached: no finalizer, no auto-sync. Workloads stay scaled to 0 as the rollback for the
  # lakon rename; the file is deleted in the rename plan Task 7 and the namespace by hand later.
  syncPolicy: {}
