# argocd had no NetworkPolicy until netpol-test found argocd-server open to every namespace.
# Components talk to each other inside the namespace; the UI/API is reached only through the
# cloudflared tunnel; the controller and repo-server need unrestricted egress (GitHub, API server).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  egress:
    - {}
