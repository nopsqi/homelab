# argocd had no NetworkPolicy until netpol-test found argocd-server open to every namespace.
# Components talk to each other inside the namespace; the controller and repo-server need
# unrestricted egress (GitHub over SSH, the API server). Nothing scrapes ArgoCD today.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - {}
---
# The UI/API is reached only through the cloudflared tunnel, and only on the server port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-server-tunnel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
      ports:
        - protocol: TCP
          port: 8080
