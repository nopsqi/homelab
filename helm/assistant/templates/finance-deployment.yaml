apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-finance
  labels: { app: assistant-finance }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: assistant-finance } }
  template:
    metadata:
      labels: { app: assistant-finance }
    spec:
      {{- include "assistant.pod" . | nindent 6 }}
      containers:
        - name: finance
          {{- include "assistant.container" (dict "root" . "role" "workers/finance") | nindent 10 }}
            - { name: PORT, value: "8080" }
            - { name: MODEL, value: {{ .Values.models.finance | quote }} }
            - { name: CONFIRM_ABOVE_IDR, value: {{ .Values.confirmAboveIdr | quote }} }
            - { name: DATA_DIR, value: /data }
          envFrom:
            - secretRef: { name: assistant-finance-secret }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 15, periodSeconds: 10 }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources: {{- toYaml .Values.resources.finance | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: assistant-finance-data }
