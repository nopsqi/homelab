# Accounting tool server: actual-mcp over HTTP behind a bearer. Holds the Actual credentials; no model of its
# own (the `finance` subagent in the Claude session is the brain). Only the Claude pod may call it.
# assistant-finance serves Naila and the finance session; assistant-finance-test (finance.testServer) is the same
# server on the test copy of the budget, with its own bearer, used only by /config/naila-test.sh and the live suite.
{{- range $name, $on := dict "assistant-finance" .Values.finance.enabled "assistant-finance-test" (and .Values.finance.enabled .Values.finance.testServer) }}
{{- if $on }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: { app: {{ $name }} }
spec:
  {{- if eq $name "assistant-finance" }}
  replicas: 1
  {{- else }}
  # The test server has no replicas here: it sits at 0 and tests/live/run.sh (naila repo) scales it up for a test run;
  # ArgoCD leaves a field the manifest doesn't set alone.
  {{- end }}
  strategy: { type: Recreate }
  selector: { matchLabels: { app: {{ $name }} } }
  template:
    metadata:
      labels: { app: {{ $name }} }
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: finance
          image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
          command: ["node", "packages/actual-mcp/dist/server.js"]
          env:
            - { name: MCP_HTTP_PORT, value: "8080" }
            - { name: ACTUAL_DATA_DIR, value: /data/actual }
            - { name: TZ, value: {{ $.Values.tz | quote }} }
          envFrom:
            - secretRef: { name: {{ $name }}-secret }   # ACTUAL_URL ACTUAL_PASSWORD ACTUAL_SYNC_ID MCP_SECRET
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /data }]
          resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 256Mi } }
      volumes:
        - { name: data, emptyDir: {} }   # Actual's local cache, rebuilt from the server on start
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: { app: {{ $name }} }
  ports: [{ port: 8080, targetPort: 8080, protocol: TCP }]
{{- if $.Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ $name }} }
spec:
  podSelector: { matchLabels: { app: {{ $name }} } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: assistant-claude } } }]
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: actual } } }]
      ports: [{ protocol: TCP, port: 5006 }]
{{- end }}
{{- end }}
{{- end }}
