apiVersion: v1
kind: ServiceAccount
metadata:
  name: assistant-ops
---
# Read-only. No secrets, no configmaps, no exec, no write verb. This, not the prompt, is the boundary.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: assistant-reader
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, nodes, namespaces, persistentvolumeclaims, services]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: assistant-reader
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: assistant-reader }
subjects:
  - { kind: ServiceAccount, name: assistant-ops, namespace: {{ .Release.Namespace }} }
