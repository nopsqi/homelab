{{- range $k, $name := dict "finance" "finance" "financeTest" "finance-test" "ops" "ops" "claude" "claude" "harness" "harness" }}
{{- if or (ne $k "harness") $.Values.harness.enabled }}
{{- with index $.Values.sealedSecret $k }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: assistant-{{ $name }}-secret
spec:
  encryptedData: {{- toYaml . | nindent 4 }}
  template:
    metadata:
      name: assistant-{{ $name }}-secret
      namespace: {{ $.Release.Namespace }}
    type: Opaque
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.sealedSecret.ghcrPull }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull
spec:
  encryptedData:
    .dockerconfigjson: {{ .Values.sealedSecret.ghcrPull }}
  template:
    metadata:
      name: ghcr-pull
      namespace: {{ .Release.Namespace }}
    type: kubernetes.io/dockerconfigjson
{{- end }}
{{- with .Values.sealedSecret.smb }}
---
# SMB login for the vault mount (Storage Box sub-account "assistant"); referenced by the PV's nodeStageSecretRef.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: assistant-smb
spec:
  encryptedData: {{- toYaml . | nindent 4 }}
  template:
    metadata:
      name: assistant-smb
      namespace: {{ $.Release.Namespace }}
    type: Opaque
{{- end }}
{{- if .Values.harness.enabled }}
{{- with .Values.sealedSecret.providerKeys }}
---
# The API providers' keys for the harness core (mounted read-only at /run/provider-keys in the harness container only), one
# data key per provider (anthropic-api). Sealed with strict scope: this name and namespace only.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: assistant-provider-keys
spec:
  encryptedData: {{- toYaml . | nindent 4 }}
  template:
    metadata:
      name: assistant-provider-keys
      namespace: {{ $.Release.Namespace }}
    type: Opaque
{{- end }}
{{- end }}
