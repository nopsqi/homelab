{{- range tuple "core" "finance" "ops" "telegram" }}
{{- $blob := index $.Values.sealedSecret . }}
{{- if and $blob (or (ne . "telegram") $.Values.telegram.enabled) }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: assistant-{{ . }}-secret
spec:
  encryptedData: {{- toYaml $blob | nindent 4 }}
  template:
    metadata:
      name: assistant-{{ . }}-secret
      namespace: {{ $.Release.Namespace }}
    type: Opaque
{{- end }}
{{- end }}
{{- if .Values.sealedSecret.ghcrPull }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull
spec:
  encryptedData:
    .dockerconfigjson: {{ .Values.sealedSecret.ghcrPull }}
  template:
    metadata:
      name: ghcr-pull
      namespace: {{ .Release.Namespace }}
    type: kubernetes.io/dockerconfigjson
{{- end }}
{{- with .Values.sealedSecret.smb }}
---
# SMB login for the vault mount (Storage Box sub-account "assistant"); referenced by the PV's nodeStageSecretRef.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: assistant-smb
spec:
  encryptedData: {{- toYaml . | nindent 4 }}
  template:
    metadata:
      name: assistant-smb
      namespace: {{ $.Release.Namespace }}
    type: Opaque
{{- end }}
