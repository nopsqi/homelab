{{- range tuple (dict "n" "assistant-core" "p" 3000) (dict "n" "assistant-finance" "p" 8080) (dict "n" "assistant-ops" "p" 8080) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .n }}
spec:
  selector: { app: {{ .n }} }
  ports:
    - { port: {{ .p }}, targetPort: {{ .p }}, protocol: TCP }
{{- end }}
