{{- if eq .Values.vault.mode "smb" }}
# Static PV on the Storage Box vault directory (the `assistant` SMB sub-account over obsidian/, the same files the
# devices sync over WebDAV with Remotely Save). Its own name, so the local-path copy below can stay as a rollback.
# Nothing is provisioned or deleted by Kubernetes.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: assistant-vault-smb
spec:
  capacity: { storage: 1Ti }
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: {{- toYaml .Values.vault.smb.mountOptions | nindent 4 }}
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: assistant-vault-smb
    volumeAttributes:
      source: {{ required "vault.smb.source is required in smb mode" .Values.vault.smb.source | quote }}
    nodeStageSecretRef:
      name: {{ .Values.vault.smb.secretName }}
      namespace: {{ .Values.vault.smb.secretNamespace }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assistant-vault-smb
  annotations: { argocd.argoproj.io/sync-options: "Delete=false,Prune=false" }
spec:
  storageClassName: ""
  volumeName: assistant-vault-smb
  accessModes: [ReadWriteMany]
  resources: { requests: { storage: 1Ti } }
{{- end }}
{{- if or (ne .Values.vault.mode "smb") .Values.vault.keepLocalCopy }}
---
# The hand-seeded local copy: the vault in localPath mode, a rollback in smb mode while vault.keepLocalCopy is true.
# Prune=false as well as Delete=false: ArgoCD's prune ignores Delete=false.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assistant-vault
  annotations: { argocd.argoproj.io/sync-options: "Delete=false,Prune=false" }
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.vault.size }} } }
{{- end }}
