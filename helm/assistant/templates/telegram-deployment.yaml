{{- if .Values.telegram.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-telegram
  labels: { app: assistant-telegram }
spec:
  replicas: 1
  strategy: { type: Recreate }   # one long-poller per bot token
  selector: { matchLabels: { app: assistant-telegram } }
  template:
    metadata:
      labels: { app: assistant-telegram }
    spec:
      {{- include "assistant.pod" . | nindent 6 }}
      containers:
        - name: telegram
          {{- include "assistant.container" (dict "root" . "role" "channels/telegram") | nindent 10 }}
            - { name: CORE_URL, value: http://assistant-core:3000 }
          envFrom:
            - secretRef: { name: assistant-telegram-secret }
          # No port, no probes: it long-polls Telegram and the core; a restart is never the cure.
          resources: {{- toYaml .Values.resources.telegram | nindent 12 }}
{{- end }}
