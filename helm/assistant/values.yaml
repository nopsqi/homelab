image:
  repository: ghcr.io/nopsqi/naila
  # tag set in values.<env>.yaml, bumped by CI alongside appVersion

tz: Asia/Jakarta
claude:
  enabled: false           # spike: Claude Code Remote Control session (your Max login), vault tools only
  version: 2.1.312         # @anthropic-ai/claude-code, pinned (auto-updater off)

login:
  enabled: false           # re-login page + login metrics (sidecar of assistant-claude), served at naila.nopsqi.dev via cloudflared
  accessTeam: nopsqi       # Cloudflare Access team; the page verifies the Access JWT itself (signature, issuer, audience, expiry)
  accessAud: ""            # Access application audience tag (the same app cloudflared enforces for the hostname)
finance:
  enabled: false           # accounting tool server (actual-mcp over HTTP); the claude session's `finance` subagent calls it
  testBudget: false        # true: tell the worker its budget is a test copy (test writes allowed). Set false before pointing at the real budget.
  testServer: false        # a second server (assistant-finance-test) on the test copy, its own bearer; only naila-test.sh uses it
# Naila's workers: one subagent each (files/agents/<name>.md, named <division>-<job>), and by default a direct
# Remote Control line of the same name in the Claude app (direct: false for a worker that only makes sense as a
# step Naila runs). model pins the direct line (Remote Control ignores the agent file's own model:).
workers:
  - { name: finance-bookkeeper, model: haiku, direct: true, sendsTo: [naila, finance-advisor] }   # replies to the advisor's plans
  - { name: finance-advisor, model: opus, direct: true, sendsTo: [naila, finance-bookkeeper] }     # plans the user approved in its chat
  - { name: ops-oncall, model: sonnet, direct: true }
# Harness mode (packages/harness) as its own pod, assistant-harness: the core runs the workers as one-shot Claude Code runs
# (its own Max login, done at naila.nopsqi.dev/harness), the user talks to them on Discord, and every change is a decision
# approved with a button. Needs claude.enabled (it reads the assistant-claude ConfigMap) and the SealedSecret
# assistant-harness-secret (DISCORD_TOKEN GATEWAY_DISCORD_SECRET CORE_TOOLS_SECRET).
harness:
  enabled: false
  # test: the test budget (assistant-finance-test, finance.testServer) and the vault folder Harness-test only.
  # real: the real budget (assistant-finance) and the whole vault. Switch only on the user's explicit go.
  phase: test
  discord:                 # ids are not secret; quoted, they're too large for a YAML number
    ownerId: ""            # the only user whose messages and button presses count
    guildId: ""
    channels: {}           # naila, finance-bookkeeper, finance-advisor, ops-oncall, decisions: channel id each
    # Webhook avatars: <avatarBase>/<speaker>.png (naila, finance-bookkeeper, finance-advisor, ops-oncall, test); "" = Discord's default.
    # The images live in this public repo under assets/naila/avatars; Discord fetches them itself.
    avatarBase: https://raw.githubusercontent.com/nopsqi/homelab/prod/assets/naila/avatars
ops:
  enabled: false           # on-call tool server (cluster-mcp over HTTP, read-only ServiceAccount); the `ops` subagent calls it
  # Namespaces whose pod logs ops may read. Never: assistant (Naila's terminal), sealed-secrets, argocd, kube-system.
  logNamespaces: [actual, alloy, astro, cloudflared, lakon, linux-box-debian, loki, minio, monitoring, netpol-test, syncthing]
# The node's IP: the ops pod reaches the API server there (kube-router evaluates egress after the ClusterIP DNAT).
apiServer:
  cidr: 0.0.0.0/0   # overridden per env

# The Obsidian vault. prod: the Storage Box SMB share the syncthing pod already syncs (subPath vault/).
# staging: a local-path PVC seeded by hand (no syncthing, no SMB CSI driver there).
vault:
  mode: localPath          # localPath | smb
  size: 2Gi                # localPath only
  subPath: vault           # smb only: folder inside the share (Remotely Save's remote base dir)
  keepLocalCopy: true      # smb only: keep the old local-path copy (PVC assistant-vault) as a rollback; false removes it from the chart
  smb:
    source: ""             # terraform output syncthing_smb, same share as helm/syncthing
    secretName: syncthing-smb
    secretNamespace: syncthing
    # No mfsymlinks: with it, a specially formatted file synced in over WebDAV becomes a symlink on this side.
    mountOptions: [seal, vers=3.1.1, uid=1000, gid=1000, file_mode=0660, dir_mode=0770, iocharset=utf8]

networkPolicy:
  enabled: true

# Filled by scripts/reseal.sh per env.
sealedSecret:
  ghcrPull: ""             # dockerconfigjson blob: the claude pod pulls the naila image (vault-mcp)
  smb: {}                  # username password: Storage Box sub-account for the vault mount (vault.mode smb)
  finance: {}              # ACTUAL_URL ACTUAL_PASSWORD ACTUAL_SYNC_ID MCP_SECRET MCP_READ_SECRET (the advisor's read-only bearer)
  financeTest: {}          # the same keys for assistant-finance-test: ACTUAL_SYNC_ID of the test copy, its own MCP_SECRET
  ops: {}                  # MCP_SECRET
  harness: {}              # DISCORD_TOKEN GATEWAY_DISCORD_SECRET CORE_TOOLS_SECRET (assistant-harness-secret; harness.enabled)
  claude: {}               # MCP_FINANCE_TOKEN MCP_FINANCE_READ_TOKEN MCP_FINANCE_TEST_TOKEN MCP_FINANCE_TEST_READ_TOKEN MCP_OPS_TOKEN (same values as the tool servers' MCP_SECRET)
