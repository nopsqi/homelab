image:
  repository: ghcr.io/nopsqi/naila
  # tag set in values.<env>.yaml, bumped by CI alongside appVersion

tz: Asia/Jakarta
claude:
  enabled: false           # spike: Claude Code Remote Control session (your Max login), vault tools only
  version: 2.1.312         # @anthropic-ai/claude-code, pinned (auto-updater off)
  # The RC lines (Remote Control sessions in the assistant-claude pod). false stops that pod (replicas 0) and drops its login
  # alerts; its ConfigMap, Secrets, PVC (the RC transcripts) and NetworkPolicy stay: the harness pod reads the ConfigMap and
  # needs claude.enabled. Flipping it never restarts the harness pod.
  rcLines: true

login:
  enabled: false           # re-login page + login metrics (sidecar of assistant-claude), served at naila.nopsqi.dev via cloudflared
  accessTeam: nopsqi       # Cloudflare Access team; the page verifies the Access JWT itself (signature, issuer, audience, expiry)
  accessAud: ""            # Access application audience tag (the same app cloudflared enforces for the hostname)
finance:
  enabled: false           # accounting tool server (actual-mcp over HTTP); the claude session's `finance` subagent calls it
  testBudget: false        # true: tell the worker its budget is a test copy (test writes allowed). Set false before pointing at the real budget.
  testServer: false        # a second server (assistant-finance-test) on the test copy, its own bearer; only naila-test.sh uses it
# Naila's workers: one subagent each (files/agents/<name>.md, named <division>-<job>), and by default a direct
# Remote Control line of the same name in the Claude app (direct: false for a worker that only makes sense as a
# step Naila runs). model pins the direct line (Remote Control ignores the agent file's own model:).
workers:
  - { name: finance-bookkeeper, model: haiku, direct: true, sendsTo: [naila, finance-advisor] }   # replies to the advisor's plans
  - { name: finance-advisor, model: opus, direct: true, sendsTo: [naila, finance-bookkeeper] }     # plans the user approved in its chat
  - { name: ops-oncall, model: sonnet, direct: true }
# Harness mode (packages/harness) as its own pod, assistant-harness: the core runs the workers as one-shot Claude Code runs
# (its own Max login, done at naila.nopsqi.dev/harness), the user talks to them through the channels below, and every change
# is a decision the user approves in the decision pool. Needs claude.enabled (it reads the assistant-claude ConfigMap) and the
# SealedSecret assistant-harness-secret (CORE_TOOLS_SECRET, plus each channel's secretKey and secretEnv keys).
harness:
  enabled: false
  # test: the test budget (assistant-finance-test, finance.testServer) and the vault folder Harness-test only.
  # real: the real budget (assistant-finance) and the whole vault. Switch only on the user's explicit go.
  phase: test
  # The channels the core talks to, by name (^[a-z][a-z0-9-]{0,31}$; the core's HARNESS_CHANNELS and GATEWAY_SECRETS list
  # every enabled one). At least one must be enabled; anything the core would refuse fails the render.
  channels:
    discord:
      enabled: false
      label: Discord                      # how the core names the channel to the workers and in the decision pool
      settle: approve                     # approve | reject | none: what it may do to a pending decision
      # retainMs: <ms>                    # optional: drop its unacked posts older than this (a channel nobody polls between runs)
      secretKey: GATEWAY_DISCORD_SECRET   # key in assistant-harness-secret: the gateway's and the core's shared secret
      gateway:                            # absent: no container (a channel served from outside the pod, such as the tests')
        uid: 1002                         # its own uid (group 1000), never 0, 1000 (the core, login), 1001 (docs) or another gateway's
        # Plain env; "" leaves a variable out. Ids are not secret; quoted, they're too large for a YAML number.
        # DISCORD_OWNER_ID: the only user whose messages and confirmations count. DISCORD_CHANNELS: name:id pairs; decisions is the
        # decision pool's channel, every other name a conversation of the core's directory (no fixed roster; others are logged).
        # DISCORD_AVATAR_BASE: webhook avatars, <base>/<speaker>.png (naila, finance-bookkeeper, finance-advisor, ops-oncall,
        # test); "" = Discord's default. The images live in this public repo under assets/naila/avatars.
        env: { DISCORD_OWNER_ID: "", DISCORD_GUILD_ID: "", DISCORD_CHANNELS: "", DISCORD_AVATAR_BASE: "https://raw.githubusercontent.com/nopsqi/homelab/prod/assets/naila/avatars" }
        secretEnv: { DISCORD_TOKEN: DISCORD_TOKEN }   # env name: key in assistant-harness-secret
        check:                            # env name: regex; a mismatch fails the render
          DISCORD_OWNER_ID: "^[0-9]{17,20}$"
          DISCORD_GUILD_ID: "^[0-9]{17,20}$"
          # lowercase-name:snowflake pairs, decisions (the decision pool) required; the gateway refuses a name or id twice
          DISCORD_CHANNELS: "^([a-z0-9][a-z0-9-]{0,63}:[0-9]{17,20},)*decisions:[0-9]{17,20}(,[a-z0-9][a-z0-9-]{0,63}:[0-9]{17,20})*$"
    # test: the unattended channel of the live checks (tests/live). It is served from outside the pod, so no gateway container.
    # Outside a test instance the core lets it only reject (or do nothing), and the render refuses settle approve.
    test:
      enabled: false
      label: Test
      settle: reject
      retainMs: 3600000                   # nobody polls it between live runs
      secretKey: GATEWAY_TEST_SECRET
  # The worker spec (naila packages/harness/src/workers-spec.ts, version 1): templates/harness.yaml renders it as
  # harness-workers.json beside each worker's instructions (/config), and the claude-code adapter's prepare.js writes the
  # agent files from it. One source per value: a worker's model is its workers[].model (naila has none there: hers is
  # here), its description its files/agents/<name>.md frontmatter's, and its ceiling (the tools its runs may ever have)
  # files/modes/harness/<name>.<ceiling>.md, split on ", ". Literal markers the template resolves per phase:
  # __FINANCE_HOST__ (assistant-finance-test or assistant-finance) and __VAULT_ROOT__ (/vault/Harness-test or /vault).
  # No server string may hold a $ or MCP_FINANCE_TOKEN (the finance write bearer): the render fails, as the core would.
  workerSpec:
    workers:
      naila:
        instructions: harness-CLAUDE.md
        brain: { provider: claude-subscription, model: default }
        servers: []
      finance-bookkeeper:
        instructions: harness-agent-finance-bookkeeper.md
        brain: { provider: claude-subscription }
        ceiling: tools
        servers:
          - { name: finance, transport: http, url: "http://__FINANCE_HOST__:8080/mcp", bearer: MCP_FINANCE_READ_TOKEN }
      finance-advisor:
        instructions: harness-agent-finance-advisor.md
        brain: { provider: claude-subscription }
        ceiling: tools
        servers:
          - { name: finance-read, transport: http, url: "http://__FINANCE_HOST__:8080/mcp", bearer: MCP_FINANCE_READ_TOKEN }
          # read-only (NOTES_READONLY, harness-start needs the image's support): its write tools are floor-denied anyway; a note
          # change is a plan the user approves, carried out by the core's own notes executor, which never gets NOTES_READONLY
          - { name: finance-notes, transport: stdio, command: node, args: [/naila/packages/vault-mcp/dist/notes-server.js], env: { VAULT_ROOT: "__VAULT_ROOT__/Finance/", NOTES_READONLY: "1" } }
      ops-oncall:
        instructions: harness-agent-ops-oncall.md
        brain: { provider: claude-subscription }
        ceiling: tools
        servers:
          - { name: ops, transport: http, url: "http://assistant-ops:8080/mcp", bearer: MCP_OPS_TOKEN }
      # The web and nothing else (WebSearch and WebFetch, through web-guard.mjs --by-worker): no server, not even the core's.
      # Not in workers[] above: no RC line, no direct line or channel of its own; only naila asks it. Its model is set here.
      researcher:
        instructions: harness-agent-researcher.md
        brain: { provider: claude-subscription, model: sonnet }
        ceiling: tools
        servers: []
    summary:
      brain: { provider: claude-subscription, model: default }
ops:
  enabled: false           # on-call tool server (cluster-mcp over HTTP, read-only ServiceAccount); the `ops` subagent calls it
  # Namespaces whose pod logs ops may read. Never: assistant (Naila's terminal), sealed-secrets, argocd, kube-system.
  logNamespaces: [actual, alloy, astro, cloudflared, lakon, linux-box-debian, loki, minio, monitoring, netpol-test, syncthing]
# The node's IP: the ops pod reaches the API server there (kube-router evaluates egress after the ClusterIP DNAT).
apiServer:
  cidr: 0.0.0.0/0   # overridden per env

# The Obsidian vault. prod: the Storage Box SMB share the syncthing pod already syncs (subPath vault/).
# staging: a local-path PVC seeded by hand (no syncthing, no SMB CSI driver there).
vault:
  mode: localPath          # localPath | smb
  size: 2Gi                # localPath only
  subPath: vault           # smb only: folder inside the share (Remotely Save's remote base dir)
  keepLocalCopy: true      # smb only: keep the old local-path copy (PVC assistant-vault) as a rollback; false removes it from the chart
  smb:
    source: ""             # terraform output syncthing_smb, same share as helm/syncthing
    secretName: syncthing-smb
    secretNamespace: syncthing
    # No mfsymlinks: with it, a specially formatted file synced in over WebDAV becomes a symlink on this side.
    mountOptions: [seal, vers=3.1.1, uid=1000, gid=1000, file_mode=0660, dir_mode=0770, iocharset=utf8]

networkPolicy:
  enabled: true

# Filled by scripts/reseal.sh per env.
sealedSecret:
  ghcrPull: ""             # dockerconfigjson blob: the claude pod pulls the naila image (vault-mcp)
  smb: {}                  # username password: Storage Box sub-account for the vault mount (vault.mode smb)
  finance: {}              # ACTUAL_URL ACTUAL_PASSWORD ACTUAL_SYNC_ID MCP_SECRET MCP_READ_SECRET (the advisor's read-only bearer)
  financeTest: {}          # the same keys for assistant-finance-test: ACTUAL_SYNC_ID of the test copy, its own MCP_SECRET
  ops: {}                  # MCP_SECRET
  harness: {}              # DISCORD_TOKEN GATEWAY_DISCORD_SECRET CORE_TOOLS_SECRET (assistant-harness-secret; harness.enabled)
  claude: {}               # MCP_FINANCE_TOKEN MCP_FINANCE_READ_TOKEN MCP_FINANCE_TEST_TOKEN MCP_FINANCE_TEST_READ_TOKEN MCP_OPS_TOKEN (same values as the tool servers' MCP_SECRET)
  providerKeys: {}         # anthropic-api: the API providers' keys (assistant-provider-keys, strict scope; harness.enabled), mounted at /run/provider-keys
