image:
  repository: ghcr.io/nopsqi/naila
  # tag set in values.<env>.yaml, bumped by CI alongside appVersion

tz: Asia/Jakarta
claude:
  enabled: false           # spike: Claude Code Remote Control session (your Max login), vault tools only
  version: 2.1.312         # @anthropic-ai/claude-code, pinned (auto-updater off)
  # The RC lines (Remote Control sessions in the assistant-claude pod). false stops that pod (replicas 0) and drops its login
  # alerts; its ConfigMap, Secrets, PVC (the RC transcripts) and NetworkPolicy stay: the harness pod reads the ConfigMap and
  # needs claude.enabled. Flipping it never restarts the harness pod.
  rcLines: true

login:
  enabled: false           # re-login page + login metrics (sidecar of assistant-claude), served at naila.nopsqi.dev via cloudflared
  accessTeam: nopsqi       # Cloudflare Access team; the page verifies the Access JWT itself (signature, issuer, audience, expiry)
  accessAud: ""            # Access application audience tag (the same app cloudflared enforces for the hostname)
finance:
  enabled: false           # accounting tool server (actual-mcp over HTTP); the claude session's `finance` subagent calls it
  testBudget: false        # true: tell the worker its budget is a test copy (test writes allowed). Set false before pointing at the real budget.
  testServer: false        # a second server (assistant-finance-test) on the test copy, its own bearer; only naila-test.sh uses it
# Naila's workers: one subagent each (files/agents/<name>.md, named <division>-<job>), and by default a direct
# Remote Control line of the same name in the Claude app (direct: false for a worker that only makes sense as a
# step Naila runs). model pins the direct line (Remote Control ignores the agent file's own model:).
workers:
  - { name: finance-bookkeeper, model: haiku, direct: true, sendsTo: [naila, finance-advisor] }   # replies to the advisor's plans
  - { name: finance-advisor, model: opus, direct: true, sendsTo: [naila, finance-bookkeeper] }     # plans the user approved in its chat
  - { name: ops-oncall, model: sonnet, direct: true }
# Harness mode (packages/harness) as its own pod, assistant-harness: the core runs the workers as one-shot Claude Code runs
# (its own Max login, done at naila.nopsqi.dev/harness), the user talks to them through the channels below, and every change
# is a decision the user approves in the decision pool. Needs claude.enabled (it reads the assistant-claude ConfigMap) and the
# SealedSecret assistant-harness-secret (CORE_TOOLS_SECRET, plus each channel's secretKey and secretEnv keys).
harness:
  enabled: false
  # test: the test budget (assistant-finance-test, finance.testServer) and the vault folder Harness-test only.
  # real: the real budget (assistant-finance) and the whole vault. Switch only on the user's explicit go.
  phase: test
  # The channels the core talks to, by name (^[a-z][a-z0-9-]{0,31}$; the core's HARNESS_CHANNELS and GATEWAY_SECRETS list
  # every enabled one). At least one must be enabled; anything the core would refuse fails the render. Each has a `kind`
  # (required, pure-core phase 2): owner (the user's own channel) or test (the live checks': its decisions, vault changes and
  # history stay out of the owner's views). The name test is reserved for a test channel, and a test channel may not approve.
  channels:
    discord:
      enabled: false
      kind: owner                         # owner | test
      label: Discord                      # how the core names the channel to the workers and in the decision pool
      settle: approve                     # approve | reject | none: what it may do to a pending decision
      # retainMs: <ms>                    # optional: drop its unacked posts older than this (a channel nobody polls between runs)
      secretKey: GATEWAY_DISCORD_SECRET   # key in assistant-harness-secret: the gateway's and the core's shared secret
      gateway:                            # absent: no container (a channel served from outside the pod, such as the tests')
        uid: 1002                         # its own uid (group 1000), never 0, 1000 (the core, login), 1001 (docs), 1003 (files) or another gateway's
        # Plain env; "" leaves a variable out. Ids are not secret; quoted, they're too large for a YAML number.
        # DISCORD_OWNER_ID: the only user whose messages and confirmations count. Its channels are harness.places (pure-core
        # phase 6): the gateway routes each conversation by the places the core's directory gives it, so no env names a channel
        # (DISCORD_CHANNELS is gone; setting it fails the render). DISCORD_PLACES_CATEGORY: the owner's runtime category, where
        # the gateway creates and deletes the places the owner approves (a hire's too), granted Manage Channels, View, Send,
        # Manage Webhooks and Read History there. "" keeps create and delete off (a Git place is only ever linked).
        # DISCORD_AVATAR_BASE: webhook avatars, <base>/<speaker>.png (naila, finance-bookkeeper, finance-advisor, ops-oncall,
        # test); "" = Discord's default. The images live in this public repo under assets/naila/avatars.
        env: { DISCORD_OWNER_ID: "", DISCORD_GUILD_ID: "", DISCORD_PLACES_CATEGORY: "", DISCORD_AVATAR_BASE: "https://raw.githubusercontent.com/nopsqi/homelab/prod/assets/naila/avatars" }
        secretEnv: { DISCORD_TOKEN: DISCORD_TOKEN }   # env name: key in assistant-harness-secret
        check:                            # env name: regex; a mismatch fails the render
          DISCORD_OWNER_ID: "^[0-9]{17,20}$"
          DISCORD_GUILD_ID: "^[0-9]{17,20}$"
          DISCORD_PLACES_CATEGORY: "^([0-9]{17,20})?$"   # "" or a category id
    # test: the unattended channel of the live checks (tests/live). It is served from outside the pod, so no gateway container.
    # Outside a test instance the core lets it only reject (or do nothing), and the render refuses settle approve.
    test:
      enabled: false
      kind: test                          # the name test is always a test channel
      label: Test
      settle: reject
      retainMs: 3600000                   # nobody polls it between live runs
      secretKey: GATEWAY_TEST_SECRET
  # The Git base of channel places (pure-core phase 6; naila packages/harness/src/places-config.ts): templates/harness.yaml
  # renders it, in this order, as harness-setup.json's `places`. Each gives a conversation (a permanent role of roleSpec
  # below, or pool, the decision pool) its place on an enabled channel, by the channel's own ref (Discord: the channel id,
  # quoted: a string, never a YAML number). The core links each at start and never deletes one; a permanent role without a
  # place gets one plan for it, and runtime places the owner approves live in the core alone until pasted here (Naila's
  # Places.md prints the block to paste over this list). The render fails on what the core refuses at start: an entry other
  # than {conversation, channel, ref}, a channel that is not enabled, a conversation that is no role (or pool), a temporary
  # role, a conversation or a ref listed twice on one channel, a ref not matching ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,99}$; and,
  # chart-only, an enabled discord channel without a pool place (its gateway posts the decision pool there).
  places: []
  # The services the core enables (pure-core phase 3; naila packages/harness/src/services/config.ts): templates/harness.yaml
  # renders each enabled one into the core's HARNESS_SERVICES ({"version":1,"services":{"<id>":{"writeCredentials":[…]}}}),
  # and finance's env and egress peer follow finance, the ops peer cluster. writeCredentials repeats the image's declaration
  # exactly ([] included; the core and harness-start refuse a mismatch), each name ^MCP_[A-Z0-9_]+$; no role server may hold
  # one, enabled or not. vault must stay enabled, and a role server naming __FINANCE_HOST__ needs finance.
  services:                     # the services the core enables (pure-core phase 3); the image declares their tools
    finance: { enabled: true, writeCredentials: [MCP_FINANCE_TOKEN] }
    vault: { enabled: true, writeCredentials: [] }    # required until pure-core phase 4
    docs: { enabled: true, writeCredentials: [] }
    cluster: { enabled: true, writeCredentials: [] }
    web: { enabled: true, writeCredentials: [] }
    # File actions (naila setup spec 4): the files sidecar's actions (file_unzip, file_zip, image_convert, csv_query, through
    # the files container below, harness.files) and the money calculator (calculate, in the core). Neither holds a write
    # credential; an image older than file actions declares neither, so harness-start refuses the pairing.
    files: { enabled: true, writeCredentials: [] }
    calc: { enabled: true, writeCredentials: [] }
  # The owner's profile (pure-core phase 4; naila packages/harness/src/setup.ts): templates/harness.yaml renders it, with the
  # schedules, the budgets, the provider settings, the files settings and the memory below and the places above, as
  # harness-setup.json (setup spec 5: {"version":5,"profile":…,"schedules":{"jobs":[…]},"places":[…],"budgets":{…},
  # "providerSettings":{…},"files":{…},"memory":{…}}) in ConfigMap assistant-harness;
  # the core refuses a setup it can't parse. timeZone is the top-level tz (one source: TZ is rendered from it too). paths: the
  # vault folders (the core's own `system` folder with its views, trash and workspaces; the finance notes; the inbox and daily
  # notes; the test phase's folder), each a plain relative path, system and testFolder one folder name of letters, digits and
  # . _ - (the render fails otherwise). The test phase's vault root is /vault/<testFolder>; the real phase leaves that folder
  # out (VAULT_EXCLUDE). figureWords are added to the core's built-in list, never replacing it.
  profile:
    quietUntil: "07:00"
    currency: { code: IDR, symbol: Rp, locale: id-ID, entryUnit: 1000 }
    figureWords: { markers: [rp, idr], magnitudes: [juta, jt, ribu, rb, miliar, milyar, triliun, rupiah] }
    paths:
      system: Naila
      finance: Finance
      inbox: Inbox
      daily: Daily
      testFolder: Harness-test
      views: { decisions: Decisions.md, usage: Usage.md, selfChanges: Self-changes.md, vaultChanges: Vault changes.md, changelog: Engine changelog.md, memory: Memory.md, places: Places.md }
  # The jobs the core starts on its own (pure-core phase 4; naila packages/harness/src/schedules-file.ts), rendered into
  # harness-setup.json in this order. Ids are permanent: a job's sent marks are keyed by its id, so a renamed job runs its
  # current period again. `enabled` is required (true or false). A job with a `request` (run and ask jobs) has its text in
  # files/schedules/<id>.txt, rendered beside the setup file as harness-job-<id>.txt, the name `request` must hold. `uses` is
  # chart-only (dropped from the render): the services an enabled job needs; the render fails when harness.services leaves
  # one disabled. Everything else (kinds, roles, needs, windows, outputs) the core checks at start.
  schedules:
    - id: monthly-review
      kind: run
      enabled: true
      role: finance-advisor
      label: monthly review
      when: { monthDays: [2, 7], at: "09:00" }
      request: harness-job-monthly-review.txt
      includePending: true
      output: { server: finance-notes, tool: write_note, path: "{paths.finance}/Reviews/{month}.md" }
      needs: [budget.read, budget.write-plans]
      phase: real
      uses: [finance]
    - id: due-today
      kind: digest
      enabled: true
      role: naila
      label: due-today digest
      when: { daily: true }
      digest: { service: vault, kind: due-today, maxItems: 30 }
      needs: []
      phase: any
      uses: [vault]
    # Off, as production has always had it (REVIEW was never set). On: naila asks the bookkeeper every Monday and posts its
    # answer under the heading.
    - id: monday-spending
      kind: ask
      enabled: false
      role: naila
      asks: finance-bookkeeper
      label: Monday review
      heading: "Monday review, spending:"
      when: { weekday: Mon }
      request: harness-job-monday-spending.txt
      needs: [budget.read]
      phase: any
      uses: [finance]
  # The token economy's numbers (plan 7a, setup spec 3; naila packages/harness/src/economy-config.ts), rendered into
  # harness-setup.json as they stand here; the core logs them at start (economy: …) and Usage.md shows them, and a raise is
  # recorded by its Git merge. Every number is dollars (USD) and cents.
  #  - providers.<provider id>: monthlyUsd, a per-token provider's monthly budget (one without it never runs), and runCapUsd,
  #    the most one run may cost before it stops (only where the provider's adapter can cap a run). The API's numbers moved
  #    here from naila's PROVIDERS (providers/roster.ts) unchanged; the subscription spends plan limits, so it has no monthly
  #    budget, and its per-run cap stays unset until plan 7a's verdict (Task 19).
  #  - roles.<permanent role>.dailyAlertUsd and liveChecks.dailyAlertUsd: a daily spend alert. The core tells the owner once a
  #    local day (it never stops a run), and each one renders a Prometheus rule in the group naila-harness-spend
  #    (NailaRoleSpend, NailaLiveCheckSpend: a rolling 24h sum of naila_harness_cost_usd_total). None until Task 19.
  # The render fails on a role here that is no permanent role of roleSpec below, and on a value that is no number (it goes into
  # a PromQL expr). The core checks the rest at start (ranges, cents, providers it knows, what each adapter supports).
  budgets:
    providers:
      anthropic-api: { monthlyUsd: 100, runCapUsd: 5 }   # moved from naila providers/roster.ts (plan 7a), unchanged
    roles: {}          # <permanent role>: { dailyAlertUsd: <usd> } — none until plan 7a Task 19
    liveChecks: {}     # { dailyAlertUsd: <usd> }
  # Per provider id (plan 7a, setup spec 3): cacheTtl (5m or 1h), the prompt-cache TTL its runs ask for, left out so Claude
  # Code's subscription default (1h) stays; and resume, the permanent roles whose owner runs continue their last session
  # (only the lines added since are sent) while it holds at most maxInputTokens input tokens and has been idle at most
  # maxIdleMinutes. Why 100000: the roles run 200k-context models (default, opus, sonnet, haiku; none [1m]), a fresh owner
  # run's first call is about 30k tokens, and session runs turn Claude Code's auto compaction off (the probe found the
  # switch), so the cap only bounds a session's growth. Why 55: under the 1h cache TTL, so a session whose cache has expired
  # (where idle compaction can happen) is never resumed. A tainted, forwarded, test, trial or hire run never continues one.
  # The render fails on a resume role that is no permanent role of roleSpec below; the core checks the rest at start (the
  # provider, what its adapter supports, the limits against the probed Claude Code). Turning resume off: drop resume.
  providerSettings:
    claude-subscription:
      resume: { roles: [naila, finance-bookkeeper, finance-advisor, ops-oncall], maxInputTokens: 100000, maxIdleMinutes: 55 }
  # The memory's limits (plan 7b, setup spec 5; naila packages/harness/src/memory-config.ts), rendered into harness-setup.json
  # as they stand here; the core logs them at start (memory: …). Each number lies under the core's compiled ceiling
  # (MEMORY_CEILINGS): the setup may only lower it, and a raise is a code change, so the core refuses one at start.
  #  - standing: a permanent role's standing lines, the owner's facts and plans each quoted from one whole message of theirs:
  #    the most lines a conversation holds, the longest quote and meaning, and the most lines one message saves or removes;
  #  - search: history_search over the role's own past conversation: the most hits, the longest each, the most turns scanned;
  #  - remake: { maxRunsPerRole: <n> }, the summaries' re-make at start, once per role (its meta mark summary-remake:<role>),
  #    at most n runs each. Production's alone: values.prod.yaml sets it (Task 3's 8), so staging and a test instance never
  #    re-make. Left out, no re-make runs.
  # The render fails on a memory, standing, search or remake that is no map; the core checks the numbers.
  memory:
    standing: { maxLines: 20, maxQuoteChars: 600, maxMeaningChars: 200, maxChangesPerRun: 3 }   # under the core's ceilings (plan 7b)
    search: { maxHits: 10, maxHitChars: 600, maxScanTurns: 20000 }
  # The files settings (file actions, setup spec 4; naila packages/harness/src/files/config.ts), rendered into
  # harness-setup.json as they stand here. Every key is required (the core holds no default), each a whole number from 1 to
  # its ceiling in the image's compiled files rules (packages/files-sidecar/rules.json: the ceiling named on each line), but
  # image.keepExif (true or false) and types.remove (allowlisted types turned off). The render fails on a key that is
  # missing, or no number (no boolean for keepExif); the core refuses a value above its ceiling at start (tests/render-modes.sh
  # runs its parseSetup on the render). The files container's memory limit is jobs.memoryMiB + 128 MiB, and the desk's
  # emptyDir (2Gi) holds desk.totalQuotaMiB plus the largest job's output (the render checks both).
  files:
    desk:
      ttlHours: 24          # ceiling 72: how long a result stays on the desk before the hourly sweep removes it
      workerQuotaMiB: 512   # ceiling 1024: one worker's desk
      totalQuotaMiB: 1024   # ceiling 1536: the whole desk, every worker's together
    jobs:
      memoryMiB: 900        # ceiling 900: one job's address space (the files container's limit is this + 128 MiB)
      cpuSeconds: 60        # ceiling 60: one job's CPU time
      wallSeconds: 60       # ceiling 120: one job's wall-clock time
      queueSeconds: 60      # ceiling 60: how long a job may wait for its turn
    unzip:
      maxZipMiB: 25         # ceiling 25: the archive itself
      maxEntries: 1000      # ceiling 1000: entries in one archive
      maxUnpackedMiB: 200   # ceiling 200: everything it unpacks (also the job's output cap)
      maxEntryMiB: 100      # ceiling 100: one unpacked entry
      maxRatio: 200         # ceiling 200: unpacked size over packed size, per entry (zip bombs)
      maxDepth: 3           # ceiling 3: an archive unpacked from an archive, levels deep
      maxLevels: 8          # ceiling 8: folder levels inside one archive
    zip:
      maxEntries: 200       # ceiling 200: files put into one archive
      maxInMiB: 100         # ceiling 100: their total size (the job's output cap is this + 1)
    image:
      maxPixels: 50000000   # ceiling 64000000: a photo's pixels (width x height) to decode
      previewSide: 1568     # ceiling 1568: the longest side of the preview the model sees
      maxOutMiB: 100        # ceiling 100: one converted image (the job's output cap)
      keepExif: false       # true or false: keep the camera data (never the location) in a converted photo
    csv:
      maxMiB: 25            # ceiling 25: one CSV file (the job's output cap is 4 times this)
      maxRows: 200000       # ceiling 200000: its rows
      maxColumns: 200       # ceiling 200: its columns
      maxCellKiB: 32        # ceiling 32: one cell
      rowsShown: 50         # ceiling 50: rows shown to the model in one answer
      maxShownCellChars: 200   # ceiling 200: characters of one shown cell
      maxGroups: 200        # ceiling 200: groups of one grouped total
    workspace:
      quotaMiB: 1024        # ceiling 2048: one worker's workspace, for copies and moves into it
      maxFileMiB: 25        # ceiling 25: one file copied into a workspace (a desk copy's output cap)
      maxCopyFiles: 200     # ceiling 200: files in one folder copy
      maxCopyMiB: 100       # ceiling 100: one copy's total size
    outfiles:
      totalQuotaMiB: 300    # ceiling 500: files waiting for a channel to fetch them
      maxPerAnswer: 5       # ceiling 5: files one answer may carry
      keepDays: 7           # ceiling 7: how long an unfetched file is kept
    types:
      remove: []            # allowlisted types turned off (rules.json types), e.g. [heic, heif]
  # The roles config (naila packages/harness/src/workers-spec.ts, ROLES_SPEC_VERSION 6): templates/harness.yaml renders it as
  # harness-workers.json beside each role's instructions (/config), the core installs its roles from it at start (in this
  # order, the lead first), and the claude-code adapter's prepare.js writes the agent files from it. `roles` is an ordered
  # list: each role's `id` (immutable once rows are written under it), `lead: true` on exactly one (listed first), `lifecycle`
  # (spec 4: permanent, keeping its history and conversation; or temporary, hired by the lead for one job and released, with
  # no RC line in workers[] and no place in harness.places; the lead is permanent, a quarantined role temporary),
  # `hireable` (a temporary role's only, true or false: whether the lead may hire it), `display`
  # (how every channel shows it: name, avatar key), `seed` (its switches on first sight; each must apply to it, as the core
  # checks at start: tests/render-modes.sh runs naila's checkSeeds on the render; file actions added files.process,
  # files.send and calc.use to naila's and the finance workers' seeds and calc.use to ops-oncall's, applied insert-or-ignore,
  # so a switch the owner turned off stays off), `instructions` (its instructions file; the
  # lead's reach its runs as an appended system prompt, so no work dir holds a CLAUDE.md since plan 7a), `brain`, `ceiling`,
  # `servers` and `paths` (spec 3: its path grants, e.g. finance-documents, the vault's Finance/ folder through files.read;
  # absent is none). A role that holds the web (web.search or web.open in its seed, WebSearch or WebFetch in its ceiling) is
  # quarantined, which the core derives (never a key here): it holds the web and nothing else. The roles are naila,
  # finance-bookkeeper, finance-advisor, ops-oncall and researcher, in that order, naila the lead; a role with a server named
  # finance is told in the test phase that its budget is a test copy. `retired`: ids removed from roles (their rows kept,
  # never run). One source per value: a role's model is its workers[].model (naila has none there: hers is here), its description its
  # files/agents/<id>.md frontmatter's, and its ceiling (the tools its runs may ever have) files/modes/harness/<id>.<ceiling>.md,
  # split on ", ". Literal markers the template resolves per phase: __FINANCE_HOST__ (assistant-finance-test or
  # assistant-finance), __VAULT_ROOT__ (/vault/<profile.paths.testFolder> or /vault) and __FINANCE_FOLDER__ (profile.paths.finance);
  # a stdio server run from vault-mcp's dist also gets VAULT_PATHS (the profile's paths) when they are not production's
  # (vault-mcp layout.ts vaultPathsEnv: none for DEFAULT_VAULT_PATHS). No server string may hold a $ or a write credential
  # of any service in services above, enabled or not (MCP_FINANCE_TOKEN, the finance write bearer): the render fails. So do
  # a duplicate id, no lead or two, a lead not listed first, a retired id that roles also lists, a lifecycle other than
  # permanent or temporary, a misplaced or non-boolean hireable, a temporary lead, and a temporary role in workers[] or in
  # harness.places. Spec 6 (workers by plan): the core adds approved runtime roles and texts to these at each start (its
  # database's, never this file's), `private` and `oneJob` are role keys none of these sets, and restart and texts below are
  # the planned restart's settings and the texts' limit.
  roleSpec:
    roles:
      - id: naila
        lead: true
        lifecycle: permanent
        display: { name: Naila, avatar: naila }
        seed: [files.read, messaging.ask, vault.read, vault.write, docs.convert, vault.organize, files.process, files.send, calc.use]
        instructions: harness-CLAUDE.md
        brain: { provider: claude-subscription, model: default }
        servers: []
      - id: finance-bookkeeper
        lifecycle: permanent
        display: { name: Finance Bookkeeper, avatar: finance-bookkeeper }
        seed: [files.read, messaging.ask, budget.read, budget.write-plans, docs.convert, files.process, files.send, calc.use]
        paths: [finance-documents]
        instructions: harness-agent-finance-bookkeeper.md
        brain: { provider: claude-subscription }
        ceiling: tools
        servers:
          - { name: finance, transport: http, url: "http://__FINANCE_HOST__:8080/mcp", bearer: MCP_FINANCE_READ_TOKEN }
      - id: finance-advisor
        lifecycle: permanent
        display: { name: Finance Advisor, avatar: finance-advisor }
        seed: [files.read, messaging.ask, budget.read, budget.write-plans, docs.convert, files.process, files.send, calc.use]
        paths: [finance-documents]
        instructions: harness-agent-finance-advisor.md
        brain: { provider: claude-subscription }
        ceiling: tools
        servers:
          - { name: finance-read, transport: http, url: "http://__FINANCE_HOST__:8080/mcp", bearer: MCP_FINANCE_READ_TOKEN }
          # read-only (NOTES_READONLY, harness-start needs the image's support): its write tools are floor-denied anyway; a note
          # change is a plan the user approves, carried out by the core's own notes executor, which never gets NOTES_READONLY
          - { name: finance-notes, transport: stdio, command: node, args: [/naila/packages/vault-mcp/dist/notes-server.js], env: { VAULT_ROOT: "__VAULT_ROOT__/__FINANCE_FOLDER__/", NOTES_READONLY: "1" } }
      - id: ops-oncall
        lifecycle: permanent
        display: { name: Ops Oncall, avatar: ops-oncall }
        seed: [messaging.ask, cluster.read, calc.use]
        instructions: harness-agent-ops-oncall.md
        brain: { provider: claude-subscription }
        ceiling: tools
        servers:
          - { name: ops, transport: http, url: "http://assistant-ops:8080/mcp", bearer: MCP_OPS_TOKEN }
      # The web and nothing else (WebSearch and WebFetch, through web-guard.mjs --by-worker): no server, not even the core's.
      # Not in workers[] above: no RC line, no direct line or channel of its own; only naila asks it. Its model is set here.
      # Temporary and hireable (spec 4, the core's rule for a quarantined role): naila hires it for one job, released after.
      - id: researcher
        lifecycle: temporary
        hireable: true
        display: { name: Researcher, avatar: researcher }
        seed: [web.search, web.open]
        instructions: harness-agent-researcher.md
        brain: { provider: claude-subscription, model: sonnet }
        ceiling: tools
        servers: []
    retired: []
    # The summary run (spec 5, plan 7b): its brain, and maxChars, the trigger (a history's unsummarised text past this many
    # characters is summarised). The render fails on a maxChars that is no number; the core checks its range at start.
    summary:
      brain: { provider: claude-subscription, model: default }
      maxChars: 60000          # the summary trigger, moved from naila's code (plan 7b), unchanged
    # The planned restart (spec 6, workers by plan §4): an approved worker or text change applies by the engine restarting in
    # place (harness-start.sh runs prepare.js again, kubelet sees no container restart) once it is quiet. The render fails on a
    # value that is no number; the core checks the ranges at start (and that minGapMinutes is at most maxWaitMinutes).
    restart:
      maxWaitMinutes: 20       # 1 to 120: pending this long, new owner turns are accepted but held until the restart
      minGapMinutes: 10        # 1 to 60: two planned restarts are at least this far apart (changes approved between wait)
    # The instructions and handbook texts (spec 6): no text, Git's or a proposed one, is longer than maxChars characters.
    texts:
      maxChars: 40000          # 1000 to 60000
ops:
  enabled: false           # on-call tool server (cluster-mcp over HTTP, read-only ServiceAccount); the `ops` subagent calls it
  # Namespaces whose pod logs ops may read. Never: assistant (Naila's terminal), sealed-secrets, argocd, kube-system.
  logNamespaces: [actual, alloy, astro, cloudflared, lakon, linux-box-debian, loki, minio, monitoring, netpol-test, syncthing]
# The node's IP: the ops pod reaches the API server there (kube-router evaluates egress after the ClusterIP DNAT).
apiServer:
  cidr: 0.0.0.0/0   # overridden per env

# The Obsidian vault. prod: the Storage Box SMB share the syncthing pod already syncs (subPath vault/).
# staging: a local-path PVC seeded by hand (no syncthing, no SMB CSI driver there).
vault:
  mode: localPath          # localPath | smb
  size: 2Gi                # localPath only
  subPath: vault           # smb only: folder inside the share (Remotely Save's remote base dir)
  keepLocalCopy: true      # smb only: keep the old local-path copy (PVC assistant-vault) as a rollback; false removes it from the chart
  smb:
    source: ""             # terraform output syncthing_smb, same share as helm/syncthing
    secretName: syncthing-smb
    secretNamespace: syncthing
    # No mfsymlinks: with it, a specially formatted file synced in over WebDAV becomes a symlink on this side.
    mountOptions: [seal, vers=3.1.1, uid=1000, gid=1000, file_mode=0660, dir_mode=0770, iocharset=utf8]

networkPolicy:
  enabled: true

# Filled by scripts/reseal.sh per env.
sealedSecret:
  ghcrPull: ""             # dockerconfigjson blob: the claude pod pulls the naila image (vault-mcp)
  smb: {}                  # username password: Storage Box sub-account for the vault mount (vault.mode smb)
  finance: {}              # ACTUAL_URL ACTUAL_PASSWORD ACTUAL_SYNC_ID MCP_SECRET MCP_READ_SECRET (the advisor's read-only bearer)
  financeTest: {}          # the same keys for assistant-finance-test: ACTUAL_SYNC_ID of the test copy, its own MCP_SECRET
  ops: {}                  # MCP_SECRET
  harness: {}              # DISCORD_TOKEN GATEWAY_DISCORD_SECRET CORE_TOOLS_SECRET (assistant-harness-secret; harness.enabled)
  claude: {}               # MCP_FINANCE_TOKEN MCP_FINANCE_READ_TOKEN MCP_FINANCE_TEST_TOKEN MCP_FINANCE_TEST_READ_TOKEN MCP_OPS_TOKEN (same values as the tool servers' MCP_SECRET)
  providerKeys: {}         # anthropic-api: the API providers' keys (assistant-provider-keys, strict scope; harness.enabled), mounted at /run/provider-keys
