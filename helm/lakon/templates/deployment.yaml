apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakon-deployment
  labels:
    app: lakon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lakon
  template:
    metadata:
      labels:
        app: lakon
    spec:
      imagePullSecrets:
      - name: ghcr-pull
      containers:
      - name: lakon
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        env:
        {{- range $k, $v := .Values.env }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        envFrom:
        - secretRef:
            name: lakon-secret
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: 15
          periodSeconds: 20
        resources: {{- toYaml .Values.resources | nindent 10 }}
