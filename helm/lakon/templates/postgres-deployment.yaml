apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakon-postgres
  labels:
    app: lakon-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lakon-postgres
  template:
    metadata:
      labels:
        app: lakon-postgres
    spec:
      containers:
      - name: postgres
        image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
        ports:
        - containerPort: {{ .Values.postgres.service.port }}
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: lakon-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lakon-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: lakon-secret
              key: POSTGRES_DB
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
        - name: lakon-postgres-data
          mountPath: /var/lib/postgresql/data
        resources: {{- toYaml .Values.postgres.resources | nindent 10 }}
      volumes:
      - name: lakon-postgres-data
        persistentVolumeClaim:
          claimName: lakon-pvc
