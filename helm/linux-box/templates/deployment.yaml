apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-box-deployment
  labels:
    app: linux-box
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: linux-box
  template:
    metadata:
      labels:
        app: linux-box
    spec:
      # A hijacked session gets no Kubernetes API token.
      automountServiceAccountToken: false
      # webtop's s6 init needs root to set up, then drops to PUID/PGID (with
      # passwordless sudo). So no runAsNonRoot/drop ALL here — containment is
      # the netpol, no token, and Access in front.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # ping without NET_RAW: unprivileged ICMP sockets for gids 0-65535 (a
        # namespaced "safe" sysctl; the image strips ping's cap_net_raw).
        sysctls:
        - name: net.ipv4.ping_group_range
          value: "0 65535"
      # Native sidecar: the whole pod shares its network namespace, so every packet
      # leaves through Cloudflare WARP (sites see a Cloudflare IP, not the node's).
      # Its nftables kill switch drops anything else, even if warp-svc dies. The
      # desktop waits for the startupProbe, so nothing gets out before WARP is up.
      initContainers:
      - name: warp
        image: {{ .Values.warp.image.repository }}:{{ .Values.warp.image.tag }}
        restartPolicy: Always
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        startupProbe:
          exec:
            command: ["sh", "-c", "warp-cli --accept-tos status | grep -q Connected"]
          periodSeconds: 2
          failureThreshold: 90
        volumeMounts:
        - name: tun
          mountPath: /dev/net/tun
        - name: warp-state
          mountPath: /var/lib/cloudflare-warp
        resources: {{- toYaml .Values.warp.resources | nindent 10 }}
      containers:
      - name: linux-box
        # NET_RAW could stamp WARP's fwmark (SO_MARK) and slip past the kill switch
        # with sudo; ping still works via ping_group_range above.
        securityContext:
          capabilities:
            drop: ["NET_RAW"]
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        ports:
        - containerPort: {{ .Values.service.port }}
        env:
        {{- range $k, $v := .Values.env }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.service.port }}
          periodSeconds: 10
        volumeMounts:
        - name: home
          mountPath: /home/abc
        - name: shm
          mountPath: /dev/shm
        resources: {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: home
        persistentVolumeClaim:
          claimName: linux-box-home
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      # WARP registration: survives sidecar restarts, not pod restarts.
      - name: warp-state
        emptyDir: {}
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: {{ .Values.shmSize }}
