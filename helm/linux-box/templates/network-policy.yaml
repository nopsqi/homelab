{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: linux-box
spec:
  podSelector:
    matchLabels:
      app: linux-box
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the tunnel. Anything else in the cluster would skip Cloudflare Access.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Internet, any port — scripts need more than 443.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.networkPolicy.denyCidrs | nindent 14 }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# pod -> node over its public IPs never crosses the Hetzner firewall, and those IPs
# stay out of this public repo: they're a GlobalNetworkSet the Ansible calico role
# creates from the host's facts. Order 100 runs before the policy above (1000).
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: linux-box-deny-node
spec:
  tier: default
  order: 100
  selector: app == 'linux-box'
  types:
    - Egress
  egress:
    - action: Deny
      destination:
        namespaceSelector: global()
        selector: role == 'node-public-ip'
{{- end }}
