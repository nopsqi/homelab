{{- if .Values.restore.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-restore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minio-restore
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minio-restore
subjects:
- kind: ServiceAccount
  name: minio-restore
roleRef:
  kind: Role
  name: minio-restore
  apiGroup: rbac.authorization.k8s.io
---
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-restore
spec:
  podSelector:
    matchLabels:
      app: minio-restore
  policyTypes:
    - Egress
  egress:
    # Kubernetes API server
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- end }}
