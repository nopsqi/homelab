{{- if .Values.customDashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-homelab
  labels:
    grafana_dashboard: "1"
data:
  homelab-overview.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "Services Up/Down",
          "type": "table",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "options": { "0": { "color": "red", "text": "DOWN" }, "1": { "color": "green", "text": "UP" } }, "type": "value" }
              ],
              "custom": { "cellOptions": { "type": "color-text" } }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "up{namespace=~\"actual|astro|minio|cloudflared|monitoring|sealed-secrets|loki\"}",
              "legendFormat": "",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true, "container": true, "endpoint": true, "pod": true, "service": true, "instance": true, "metrics_path": true }, "renameByName": { "namespace": "Namespace", "job": "Service", "Value": "Status" } } }
          ]
        },
        {
          "title": "Pod Restarts (last 1h)",
          "type": "table",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 } ] },
              "custom": { "cellOptions": { "type": "color-text" } }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "increase(kube_pod_container_status_restarts_total[1h]) > 0",
              "legendFormat": "",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true, "container": true, "endpoint": true, "instance": true, "job": true, "service": true, "uid": true, "metrics_path": true }, "renameByName": { "namespace": "Namespace", "pod": "Pod", "Value": "Restarts" } } }
          ]
        },
        {
          "title": "CPU Usage",
          "type": "gauge",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0, "max": 1,
              "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.85 } ] }
            }
          },
          "targets": [
            {
              "expr": "1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))",
              "legendFormat": "CPU"
            }
          ]
        },
        {
          "title": "Memory Usage",
          "type": "gauge",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0, "max": 1,
              "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.85 } ] }
            }
          },
          "targets": [
            {
              "expr": "1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes",
              "legendFormat": "Memory"
            }
          ]
        },
        {
          "title": "Disk Usage",
          "type": "gauge",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0, "max": 1,
              "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.85 } ] }
            }
          },
          "targets": [
            {
              "expr": "1 - node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"}",
              "legendFormat": "Disk"
            }
          ]
        },
        {
          "title": "CPU Usage Over Time",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 11 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0, "max": 1,
              "custom": { "fillOpacity": 10 }
            }
          },
          "targets": [
            {
              "expr": "1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))",
              "legendFormat": "CPU"
            }
          ]
        },
        {
          "title": "Memory Usage Over Time",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 11 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0, "max": 1,
              "custom": { "fillOpacity": 10 }
            }
          },
          "targets": [
            {
              "expr": "1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes",
              "legendFormat": "Memory"
            }
          ]
        },
        {
          "title": "Pod Status by Namespace",
          "type": "table",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "targets": [
            {
              "expr": "count by (namespace) (kube_pod_info{namespace=~\"actual|astro|minio|cloudflared|monitoring|sealed-secrets|loki|argocd\"})",
              "legendFormat": "",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true }, "renameByName": { "namespace": "Namespace", "Value": "Pods" } } }
          ]
        },
        {
          "title": "Persistent Volume Usage",
          "type": "bargauge",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0, "max": 1,
              "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.8 } ] }
            }
          },
          "targets": [
            {
              "expr": "1 - kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes",
              "legendFormat": "{{ "{{" }} namespace {{ "}}" }}/{{ "{{" }} persistentvolumeclaim {{ "}}" }}"
            }
          ],
          "options": { "orientation": "horizontal", "displayMode": "gradient" }
        }
      ],
      "schemaVersion": 39,
      "title": "Homelab Overview",
      "uid": "homelab-overview",
      "version": 1,
      "time": { "from": "now-3h", "to": "now" },
      "refresh": "30s"
    }
{{- end }}
