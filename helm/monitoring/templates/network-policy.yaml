{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus scrapes from within namespace
    - from:
        - podSelector: {}
    # Cloudflared for Grafana/ArgoCD UI access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
    # Alloy sends logs
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alloy
  egress:
    - {}
{{- end }}
