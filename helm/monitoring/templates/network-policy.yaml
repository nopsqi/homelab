{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus scrapes from within namespace
    - from:
        - podSelector: {}
    # Cloudflared for Grafana/ArgoCD UI access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
    # Alloy sends logs
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alloy
    # Naila's ops worker reads Prometheus alerts. 9090 is only Prometheus in this namespace; the admin API is
    # off, so the worst a compromised ops pod could do here is POST /-/reload or /-/quit (lifecycle is on for
    # the operator's config reloader). Its own code only does GET /api/v1/alerts. Accepted; no proxy.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: assistant
          podSelector:
            matchLabels:
              app: assistant-ops
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - {}
{{- end }}
