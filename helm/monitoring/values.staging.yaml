customAlerts:
  enabled: true

customDashboards:
  enabled: true

networkPolicy:
  enabled: true

kube-prometheus-stack:
  alertmanager:
    enabled: false

  kube-state-metrics:
    livenessProbe:
      initialDelaySeconds: 30
      timeoutSeconds: 10
    readinessProbe:
      initialDelaySeconds: 30
      timeoutSeconds: 10

  prometheus:
    prometheusSpec:
      storageSpec: {}

sealedSecrets:
  grafana:
    admin_user: 
    admin_password: 
  alertmanager:
    alertmanager_yaml: 
