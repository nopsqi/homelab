apiVersion: apps/v1
kind: Deployment
metadata:
  name: naila-deployment
  labels:
    app: naila
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: naila
  template:
    metadata:
      labels:
        app: naila
    spec:
      imagePullSecrets:
      - name: ghcr-pull
      containers:
      - name: naila
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        env:
        {{- range $k, $v := .Values.env }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        envFrom:
        - secretRef:
            name: naila-secret
        readinessProbe:
          httpGet:
            path: /api/health
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
        - name: naila-data
          # App writes all SQLite DBs under <repo>/data == /app/data (see _DATA in
          # discord_bot.py); per-channel conversation DBs honor no env override, so the
          # PVC must land here or multi-tenant history is lost on restart.
          mountPath: /app/data
        resources: {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: naila-data
        persistentVolumeClaim:
          claimName: naila-pvc
