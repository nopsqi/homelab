{{- $root := . }}
{{- range .Values.gateway.channels }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naila-gateway-{{ .name }}
  labels:
    app: naila-gateway
    gateway: {{ .name }}
spec:
  replicas: 1
  # Two processes on one WhatsApp session fight over it and get the number logged out,
  # so the old pod must be gone before the new one starts — never RollingUpdate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: naila-gateway
      gateway: {{ .name }}
  template:
    metadata:
      labels:
        app: naila-gateway
        gateway: {{ .name }}
    spec:
      imagePullSecrets:
      - name: ghcr-pull
      containers:
      - name: naila-gateway
        image: {{ .repository | default $root.Values.gateway.image.repository }}:{{ $root.Values.gateway.image.tag }}
        env:
        - name: CHANNEL_ID
          value: {{ .channelId | quote }}
        - name: NAILA_URL
          value: "http://naila-service:{{ $root.Values.service.port }}"
        # GATEWAY_SECRET rides in naila-secret, the same secret the web pod reads — one seal,
        # both sides of the same comparison.
        envFrom:
        - secretRef:
            name: naila-secret
        volumeMounts:
        - name: wa-auth
          mountPath: /app/.wa-auth
        # No probes: it serves no port. Liveness would have to shell out, and a restart is
        # the wrong cure anyway — the socket reconnects itself, and a logged-out session
        # needs a human with a phone, not a kubelet.
        resources: {{- toYaml $root.Values.gateway.resources | nindent 10 }}
      volumes:
      - name: wa-auth
        persistentVolumeClaim:
          claimName: naila-gateway-{{ .name }}-pvc
{{- end }}
