{{- $root := . }}
{{- range .Values.gateway.channels }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: naila-gateway-{{ .name }}-pvc
  # This volume IS the paired session. Pruning it does not cost a restart, it costs scanning
  # a fresh QR from the phone — so it outlives the app that claims it.
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  storageClassName: "local-path"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $root.Values.gateway.storage.size }}
{{- end }}
