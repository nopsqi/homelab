image:
  tag: sha-38f8e9f

networkPolicy:
  enabled: true

gateway:
  image:
    tag: sha-38f8e9f
  # One entry per channel: a WhatsApp session is a socket bound to one account and one
  # credential volume, so channels share neither a process nor a number.
  channels:
    - name: naila
      channelId: "92ffe4d8-f242-4dcb-a4dc-f12934cdb56f"

# Filled by `kubeseal` against the prod controller's public key. Required keys only —
# the optional ones (ANTHROPIC_API_KEY, OPENAI_API_KEY, GOOGLE_GENERATIVE_AI_API_KEY,
# ADMIN_EMAIL, ADMIN_PASSWORD) stay commented out until needed; templates/sealedsecret.yaml
# only renders the keys that are set.
sealedSecret:
  DATABASE_URL: 
  APP_SECRET: 
  POSTGRES_USER: 
  POSTGRES_PASSWORD: 
  POSTGRES_DB: 
  OPENROUTER_API_KEY: 
  dockerconfigjson: 
  GATEWAY_SECRET: 
  # ANTHROPIC_API_KEY: REPLACE_WITH_KUBESEAL
  # OPENAI_API_KEY: REPLACE_WITH_KUBESEAL
  # GOOGLE_GENERATIVE_AI_API_KEY: REPLACE_WITH_KUBESEAL
  # ADMIN_EMAIL: REPLACE_WITH_KUBESEAL
  # ADMIN_PASSWORD: REPLACE_WITH_KUBESEAL
  # GATEWAY_SECRET: REPLACE_WITH_KUBESEAL   # required before gateway.enabled: true
