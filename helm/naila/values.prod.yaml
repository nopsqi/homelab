image:
  tag: sha-7cc77f9   # bumped by promotion PR

networkPolicy:
  enabled: true

env:
  NAILA_ENV: "prod"
  # Empty = multi-tenant (per-channel instances). Do not set a guild id, or the
  # per-channel feature is disabled. Channels are registered via the web console.
  NAILA_DISCORD_GUILD_ID: ""
  NAILA_DISCORD_CLIENT_ID: "REPLACE_WITH_PROD_CLIENT_ID"
  NAILA_SERVER_URL: "https://naila.nopsqi.dev"
  NAILA_FRONTEND_URL: "https://naila.nopsqi.dev"
  NAILA_CORS_ORIGINS: "https://naila.nopsqi.dev"
  NAILA_OAUTH_REDIRECT_URI: "https://naila.nopsqi.dev/api/auth/callback"

sealedSecret:
  dockerconfigjson: REPLACE_WITH_KUBESEAL
  discord_token: REPLACE_WITH_KUBESEAL
  discord_client_secret: REPLACE_WITH_KUBESEAL
  secret_key: REPLACE_WITH_KUBESEAL
