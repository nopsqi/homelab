image:
  tag: sha-93545d3

networkPolicy:
  enabled: true

env:
  NAILA_ENV: "staging"
  # Empty = multi-tenant (per-channel instances). Do not set a guild id, or the
  # per-channel feature is disabled. Channels are registered via the web console.
  NAILA_DISCORD_GUILD_ID: ""
  NAILA_DISCORD_CLIENT_ID: "REPLACE_WITH_STAGING_OR_SHARED_CLIENT_ID"
  # No staging tunnel: web reached via `kubectl port-forward svc/naila-service 8000:80`.
  NAILA_SERVER_URL: "http://localhost:8000"
  NAILA_FRONTEND_URL: "http://localhost:8000"
  NAILA_CORS_ORIGINS: "http://localhost:8000,http://localhost:5173"
  NAILA_OAUTH_REDIRECT_URI: "http://localhost:8000/api/auth/callback"

sealedSecret:
  dockerconfigjson: REPLACE_WITH_KUBESEAL
  discord_token: REPLACE_WITH_KUBESEAL
  discord_client_secret: REPLACE_WITH_KUBESEAL
  secret_key: REPLACE_WITH_KUBESEAL
