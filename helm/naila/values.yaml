image:
  repository: ghcr.io/nopsqi/naila
  # tag set in values.{staging,prod}.yaml

networkPolicy:
  enabled: false

storage:
  size: "256Mi"

# Non-secret env vars. Secrets come from the SealedSecret (naila-secret).
env:
  OWNER_DISCORD_ID: ""
  CHAT_CHANNEL_ID: "1505304848856514750"
  LLM_PROVIDER: "anthropic"
  ANTHROPIC_MODEL: "claude-haiku-4-5-20251001"
  GEMINI_MODEL: "gemini-2.5-flash"
  INITIATIVE_TIMEZONE: "Asia/Jakarta"

resources:
  limits:
    cpu: "0.5"
    memory: "256Mi"
  requests:
    cpu: "0.05"
    memory: "96Mi"

# Filled by `kubeseal`. Each env's values.{env}.yaml carries its own
# encrypted blobs (encrypted against that env's controller key).
sealedSecret: {}
#   discord_token: AgB...
#   anthropic_api_key: AgB...
#   gemini_api_key: AgB...
