apiVersion: batch/v1
kind: CronJob
metadata:
  name: netpol-test
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: {{ .Values.image }}
              command: ["sh", "/scripts/check.sh"]
              resources:
                requests:
                  cpu: "10m"
                  memory: "16Mi"
                limits:
                  memory: "64Mi"
              volumeMounts:
                - name: script
                  mountPath: /scripts
          volumes:
            - name: script
              configMap:
                name: netpol-test-script
