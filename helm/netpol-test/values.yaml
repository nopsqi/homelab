image: curlimages/curl:8.11.1
schedule: "0 */6 * * *"

# Reachable from any namespace: proves DNS + internet egress work.
mustReach:
  - https://cloudflare.com

# Blocked by the target namespace's NetworkPolicy: proves isolation.
# curl exit 7 (refused) or 28 (timeout) counts as blocked.
mustBlock:
  - http://loki.loki:3100/ready
  - http://monitoring-grafana.monitoring:80/api/health
  - http://monitoring-kube-prometheus-prometheus.monitoring:9090/-/ready
  - http://minio-service.minio:9000/minio/health/live
  - http://actual-service.actual:5006
  - https://argocd-server.argocd:443
