{{- if .Values.smb.sealedSecret.password }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: syncthing-smb
spec:
  encryptedData:
    username: {{ .Values.smb.sealedSecret.username | quote }}
    password: {{ .Values.smb.sealedSecret.password | quote }}
  template:
    metadata:
      name: syncthing-smb
      namespace: {{ .Release.Namespace }}
    type: Opaque
{{- end }}
